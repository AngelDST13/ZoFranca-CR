<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | ZoFranca CR</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/login.css" />
</head>
<body class="pagina-auth">
  <main class="tarjeta-auth">
    <div class="tarjeta-auth__marca">
      <small>ZF</small>
      <h1>Bienvenido a ZoFranca CR</h1>
      <p>Ingrese con su cuenta para gestionar solicitudes y cumplimiento.</p>
    </div>

    <form id="formulario-acceso" class="formulario-auth">
      <div class="roles-acceso">
        <label>
          <input type="radio" name="rol" value="analista" checked />
          Analista ZF
        </label>
        <label>
          <input type="radio" name="rol" value="empresa" />
          Empresa
        </label>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" required placeholder="nombre@empresa.cr" />
      </div>

      <div class="form-group campo-password">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>

      <div id="error-acceso" class="alerta-error" hidden style="color: #d32f2f; font-size: 0.85rem;">
        Credenciales incorrectas. Verifique su correo y contraseña.
      </div>

      <button type="submit" id="boton-acceso" class="btn-primary" style="width: 100%; padding: 0.75rem; background: #0f2c59; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">
        Iniciar sesión
      </button>
    </form>

    <div class="cuentas-demo">
      <small><strong>Cuentas de demostración</strong></small>
      <div class="cuenta-demo">
        <div>
          <strong>Analista ZF</strong>
          <small>analista@zofranca.cr</small>
        </div>
        <button type="button" data-rol="analista">Usar</button>
      </div>
      <div class="cuenta-demo">
        <div>
          <strong>Empresa</strong>
          <small>empresa@techsolutions.cr</small>
        </div>
        <button type="button" data-rol="empresa">Usar</button>
      </div>
    </div>
  </main>

  <script type="module" src="../../js/login/login.js"></script>
</body>
</html>
